version: '3.9'

services:
  api:
    build: .
    container_name: deployment-metrics-api
    environment:
      APP_ENV: development
      APP_DEBUG: 'true'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/deployment_metrics
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: deployment-metrics-db
    environment:
      POSTGRES_DB: deployment_metrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
